services:
  - type: web
    name: lle-pairbuilder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_platform.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: RCLONE_REMOTE
        value: drive
      - key: RCLONE_CONFIG
        sync: false
      - key: RCLONE_DATASET_ROOT
        value: LLIE_Dataset
