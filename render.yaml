services:
  - type: web
    name: lle-pairbuilder
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_platform.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: lowlight_datasets
      - key: CLEANUP_AFTER_SAVE
        value: "true"
